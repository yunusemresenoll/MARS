[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-data-foundation"
version = "0.1.0"
description = "Provenance-first scientific data foundation for Mars"
requires-python = ">=3.12"

[project.scripts]
mars-validate = "mars_foundation.validation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

